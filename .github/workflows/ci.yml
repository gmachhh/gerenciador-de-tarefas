
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [17, 21, 25] 

    name: Java ${{ matrix.java }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Compilar e rodar os testes
        run: ./mvnw -B verify
